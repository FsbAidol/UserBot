# Конфигурация приложения для Amvera Cloud.
# https://docs.amvera.ru/applications/configuration/config-file.html
#
# Собирается корневой Dockerfile (он же используется на BotHost), запускается
# deploy/paas/supervisor.py: страница входа с QR-кодом + сам юзербот.
#
# containerPort должен совпадать с APP_PORT из Dockerfile (8080).

meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  dockerfile: Dockerfile
  skip: false

run:
  persistenceMount: /data
  containerPort: 8080
